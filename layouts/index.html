{{ define "main" }}
<div class="container">
  <h1>Service Status Search</h1>
  <p class="subtitle">서비스 상태 검색 페이지</p>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="서비스 검색"
      oninput="filterServices()">
  </div>

  <!-- 탭 버튼 -->
  <div class="tabs">
    {{ range $i, $g := .Site.Data.services.services }}
      <button
        class="tab-btn"
        data-target="group-{{ $g.group | urlize }}"
        onclick="activateTab(this)">
        {{ $g.group }}
      </button>
    {{ end }}
  </div>

  <!-- 그룹 섹션 -->
  {{ range .Site.Data.services.services }}
    <section class="group" id="group-{{ .group | urlize }}">
      <h2>{{ .group }}</h2>
      <div class="grid">
        {{ range .items }}
          <a class="btn" href="{{ .url }}" target="_blank" rel="noopener">
            {{ .name }}
          </a>
        {{ end }}
      </div>
    </section>
  {{ end }}

  <div class="footer">
    💡 각 버튼을 클릭하면 새 탭에서 상태 페이지가 열립니다.
  </div>
</div>

<script>
  const TAB_ACTIVE_CLASS = "tab-active";

  function getTabs() {
    return Array.from(document.querySelectorAll(".tab-btn"));
  }

  function getGroups() {
    return Array.from(document.querySelectorAll(".group"));
  }

  function setActiveGroupById(id) {
    const groups = getGroups();
    groups.forEach(g => {
      if (g.id === id) {
        g.dataset.active = "true";
        g.style.display = "block";
      } else {
        g.dataset.active = "false";
        g.style.display = "none";
      }
    });
  }

  function getActiveGroup() {
    return getGroups().find(g => g.dataset.active === "true");
  }

  function resetButtons(group) {
    if (!group) return;
    const buttons = group.querySelectorAll(".btn");
    buttons.forEach(btn => {
      btn.style.display = "flex";
    });
    const msg = group.querySelector(".no-results");
    if (msg) msg.remove();
  }

  function getFirstGroupId() {
    const tabs = getTabs();
    if (!tabs.length) return null;
    return tabs[0].getAttribute("data-target");
  }

  // 초기 상태: 첫 번째 탭 + 그 섹션만 보이게
  function initTabs() {
    const tabs = getTabs();
    const groups = getGroups();
    const firstGroupId = getFirstGroupId();
    if (!tabs.length || !groups.length || !firstGroupId) return;

    const firstTab = tabs[0];

    tabs.forEach(t => t.classList.remove(TAB_ACTIVE_CLASS));
    firstTab.classList.add(TAB_ACTIVE_CLASS);

    setActiveGroupById(firstGroupId);
    resetButtons(document.getElementById(firstGroupId));

    const search = document.getElementById("search");
    if (search) search.value = "";
  }

  // 탭 클릭: 해당 섹션만 보이도록
  function activateTab(btn) {
    const targetId = btn.getAttribute("data-target");
    const tabs = getTabs();

    tabs.forEach(t => t.classList.remove(TAB_ACTIVE_CLASS));
    btn.classList.add(TAB_ACTIVE_CLASS);

    setActiveGroupById(targetId);
    resetButtons(document.getElementById(targetId));

    const search = document.getElementById("search");
    if (search) search.value = "";
  }

  // 검색: 현재 활성 그룹에서만 필터, 결과 없으면 메시지
  function filterServices() {
    const input = document.getElementById("search");
    const query = input.value.toLowerCase();

    let activeGroup = getActiveGroup();
    if (!activeGroup) {
      // 혹시 data-active가 안 맞아 있으면 첫 번째 그룹 강제 활성화
      const groups = getGroups();
      if (!groups.length) return;
      activeGroup = groups[0];
      activeGroup.dataset.active = "true";
      activeGroup.style.display = "block";
    }

    // 검색어 비었으면: 현재 탭 섹션 유지 + 버튼/메시지만 초기화
    if (!query.trim()) {
      resetButtons(activeGroup);
      return;
    }

    // 이전 메시지 제거
    const oldMsg = activeGroup.querySelector(".no-results");
    if (oldMsg) oldMsg.remove();

    const buttons = activeGroup.querySelectorAll(".btn");
    let visibleCount = 0;

    buttons.forEach(btn => {
      const text = btn.textContent.toLowerCase();
      const match = text.includes(query);
      btn.style.display = match ? "flex" : "none";
      if (match) visibleCount++;
    });

    // 결과 0개면 "검색 항목이 없습니다" 추가
    if (visibleCount === 0) {
      const grid = activeGroup.querySelector(".grid");
      if (!grid) return;

      const noResults = document.createElement("div");
      noResults.className = "no-results";
      noResults.textContent = "검색 항목이 없습니다.";
      noResults.style.cssText = `
        grid-column: 1 / -1;
        padding: 40px 20px;
        text-align: center;
        color: #6b7280;
        font-size: 16px;
        border: 2px dashed #d1d5db;
        border-radius: 8px;
        background: #f9fafb;
      `;
      grid.appendChild(noResults);
    }
  }

  document.addEventListener("DOMContentLoaded", initTabs);
</script>

<style>
  .tabs {
    display:flex;
    gap:8px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }

  .tab-btn {
    padding:8px 14px;
    border-radius:999px;
    border:1px solid #cbd5f5;
    background:#e5edff;
    color:#1e293b;
    font-size:14px;
    cursor:pointer;
  }

  .tab-btn.tab-active {
    background:#4f46e5;
    color:#ffffff;
    border-color:#4338ca;
  }

  /* 검색 결과 없음 메시지 그리드 정렬 */
  .group .no-results {
    grid-column: 1 / -1;
  }
</style>
{{ end }}
