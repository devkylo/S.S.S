{{ define "main" }}
<div class="container">
  <h1>🔍 Status List</h1>
  <p class="subtitle">주요 서비스의 상태 페이지를 확인하세요</p>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="🔍 서비스 검색 (OpenAI, 구글, 카카오 등)"
      oninput="filterServices()">
  </div>

  <!-- 탭 버튼 -->
  <div class="tabs" style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;">
    {{ range $i, $g := .Site.Data.services.services }}
      <button
        class="tab-btn"
        data-target="group-{{ $g.group | urlize }}"
        onclick="activateTab(this)"
        style="padding:8px 14px; border-radius:999px; border:1px solid #cbd5f5;
               background:#e5edff; color:#1e293b; font-size:14px; cursor:pointer;">
        {{ $g.group }}
      </button>
    {{ end }}
  </div>

  <!-- 그룹 섹션 -->
  {{ range .Site.Data.services.services }}
    <section class="group" id="group-{{ .group | urlize }}">
      <h2>{{ .group }}</h2>
      <div class="grid">
        {{ range .items }}
          <a class="btn" href="{{ .url }}" target="_blank" rel="noopener">
            {{ .name }}
          </a>
        {{ end }}
      </div>
    </section>
  {{ end }}

  <div class="footer">
    💡 각 버튼을 클릭하면 새 탭에서 상태 페이지가 열립니다.
  </div>
</div>

<script>
  const TAB_ACTIVE_CLASS = "tab-active";

  function initTabs() {
    const tabs = document.querySelectorAll(".tab-btn");
    const groups = document.querySelectorAll(".group");
    if (tabs.length === 0 || groups.length === 0) return;

    // 첫 탭/그룹만 보이게
    tabs.forEach((t, idx) => {
      if (idx === 0) t.classList.add(TAB_ACTIVE_CLASS);
      else t.classList.remove(TAB_ACTIVE_CLASS);
    });
    groups.forEach((g, idx) => {
      g.style.display = idx === 0 ? "block" : "none";
    });
  }

  function activateTab(btn) {
    const targetId = btn.getAttribute("data-target");
    const tabs = document.querySelectorAll(".tab-btn");
    const groups = document.querySelectorAll(".group");

    tabs.forEach(t => t.classList.remove(TAB_ACTIVE_CLASS));
    btn.classList.add(TAB_ACTIVE_CLASS);

    groups.forEach(g => {
      g.style.display = (g.id === targetId) ? "block" : "none";
    });

    // 검색어 초기화
    const search = document.getElementById("search");
    if (search) {
      search.value = "";
      resetFilter();
    }
  }

  function resetFilter() {
    const activeGroup = document.querySelector(".group:not([style*='display: none'])");
    if (!activeGroup) return;
    const buttons = activeGroup.querySelectorAll(".btn");
    buttons.forEach(btn => btn.style.display = "flex");
  }

  function filterServices() {
    const query = document.getElementById('search').value.toLowerCase();
    const activeGroup = document.querySelector(".group:not([style*='display: none'])");
    if (!activeGroup) return;

    const buttons = activeGroup.querySelectorAll(".btn");
    buttons.forEach(btn => {
      const text = btn.textContent.toLowerCase();
      btn.style.display = text.includes(query) ? "flex" : "none";
    });
  }

  document.addEventListener("DOMContentLoaded", initTabs);
</script>

<style>
  .tab-btn.tab-active {
    background:#4f46e5 !important;
    color:#ffffff !important;
    border-color:#4338ca !important;
  }
</style>
{{ end }}
